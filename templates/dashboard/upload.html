{% extends 'base.html' %}
{% load static %}

{% block content %}


  {% include 'components/navbar.html' %}

  <div class="m-4 flex items-center justify-center bg-transparent">
    <div class="bg-white bg-opacity-95 rounded-md p-6 w-full max-w-lg text-center">

      <h1 class="text-2xl font-medium mb-4 text-gray-600">Upload Statement</h1>
      {% comment %} <p class="text-gray-600 mb-6">Select your Mpesa or Bank statement (CSV, PDF, or Excel).</p> {% endcomment %}


      <form method="POST" action="{% url 'upload_statement' %}" enctype="multipart/form-data" class="flex flex-col gap-4">
        {% csrf_token %}
        <input type="file" name="statement" accept=".csv,.xls,.xlsx,.pdf"
               class="border border-gray-300 px-4 py-2 rounded-md w-full focus:outline-none focus:ring-2 focus:ring-gray-300" required>

        <button type="submit"
                           class="px-4 py-2 border border-gray-300 border-dashed rounded-md text-blue-700 hover:bg-gray-300 hover:text-blue-800 hover:rounded-md transition-all duration-300">
          Upload Statement
        </button>
      </form>

    </div>
  </div>

{% endblock %}
